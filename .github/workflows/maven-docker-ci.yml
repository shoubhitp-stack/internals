name: Java CI and Docker Hub Publish

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Compile and Run JUnit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile and run JUnit 5 tests
        run: mvn clean test

  build-and-push-docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    # Enforces that Docker build/push runs ONLY after all JUnit tests succeed
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/employee-salary-calculator:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/employee-salary-calculator:${{ github.sha }}